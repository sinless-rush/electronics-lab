<header><b>Basic Electronics Lab</b>

<div class="card">

</section></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),NR=14,NC=30;
const S={w:[],p:[],tool:"wire",pend:null,psu:{v:5,i:.5,on:1,cc:0},fg:{w:"sine",f:1000,a:10},sc:{v1:5,v2:5,t:5e-4,xy:0},T:0,msgs:[],ip:0,dmv:0,ex:"free",f2:200,a2:5,q:[],wsig:""};
const jn=[64,65,66,67,68,69,69,70,71,72];
const nodeOf=h=>{if(h>=1000)return jn[h-1000];const c=h/NR|0,r=h%NR;return r<5?c*2:r<10?c*2+1:60+r-10};
const fm=(v,u)=>{for(const[k,p]of[[1e6,"M"],[1e3,"k"],[1,""],[1e-3,"m"],[1e-6,"µ"],[1e-9,"n"]])if(v>=k*.999)return+(v/k).toPrecision(3)+p+u;return v+u};
const LST={R:[100,220,470,1e3,1500,2200,3900,8200,1e4,2.2e4,4.7e4,4.7e5],C:[33e-9,1e-7,1e-6,1e-5,1e-4],Z:[5.1,12]};
/* ---------- circuit solver (nodal analysis, Newton for diodes, backward Euler for capacitors) ---------- */
const DP={D:[14e-9,.0512],LED:[1e-19,.0517],Z:[14e-9,.0512]};
function dio(e,v){const[Is,nv]=DP[e.k],x=Math.exp(Math.min(v/nv,60));let I=Is*(x-1),g=Is/nv*x;if(e.k=="Z"){const k=Math.exp(Math.min(-(v+e.p.v)/.1,60))*1e-3;I-=k;g+=k/.1}return[I,g+1e-12]}
function gauss(A,b,n){for(let i=0;i<n;i++){let p=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[p][i]))p=r;[A[i],A[p]]=[A[p],A[i]];[b[i],b[p]]=[b[p],b[i]];const d=A[i][i]||1e-30;for(let r=i+1;r<n;r++){const f=A[r][i]/d;if(f){for(let c=i;c<n;c++)A[r][c]-=f*A[i][c];b[r]-=f*b[i]}}}
const x=new Float64Array(n);for(let i=n-1;i>=0;i--){let s=b[i];for(let c=i+1;c<n;c++)s-=A[i][c]*x[c];x[i]=s/(A[i][i]||1e-30)}return x}
function prep(){const m=new Map(),id=x=>x==69?-1:(m.has(x)||m.set(x,m.size),m.get(x));[64,65,66,67,68,70,71,72].forEach(id);const E=[];
S.w.forEach(w=>E.push({k:"W",a:id(nodeOf(w.a)),b:id(nodeOf(w.b))}));
S.p.forEach(p=>{if(!p.x){E.push({k:p.t,a:id(nodeOf(p.a)),b:id(nodeOf(p.b)),g:p.g==null?-1:id(nodeOf(p.g)),p});p.si=p.sq=p.n=0}});
return{E,n:m.size,x:new Float64Array(m.size)}}
function stepSim(M,dt,t){const{E,n}=M,V=S.psu.on?S.psu.v:0,F=S.fg,sg=(f,a,w)=>{const p=6.2832*f*t;return a*(w=="sine"?Math.sin(p):w=="square"?(Math.sin(p)>=0?1:-1):.6366*Math.asin(Math.sin(p)))},fv=sg(F.f,F.a,F.w),fv2=sg(S.f2,S.a2,"sine");
for(let pass=0;pass<3;pass++){let x;
for(let it=0;it<25;it++){const A=Array.from({length:n},()=>new Float64Array(n)),b=new Float64Array(n);
const G=(a,c,g)=>{if(a>=0)A[a][a]+=g;if(c>=0)A[c][c]+=g;if(a>=0&&c>=0){A[a][c]-=g;A[c][a]-=g}};
const J=(a,c,i)=>{if(a>=0)b[a]+=i;if(c>=0)b[c]-=i};const AD=(r,c,v)=>{if(r>=0&&c>=0)A[r][c]+=v};
for(let k=0;k<n;k++)A[k][k]+=1e-9;
for(const e of E){if(e.k=="W")G(e.a,e.b,100);else if(e.k=="R")G(e.a,e.b,1/e.p.v);else if(e.k=="C"){const g=e.p.v/dt;G(e.a,e.b,g);J(e.a,e.b,g*e.p.vc)}else if(e.k=="Q"){const q=e.p,B=e.g,C=e.a,Em=e.b,Vt=.02585,ef=Math.exp(Math.min(q.vd/Vt,60)),er=Math.exp(Math.min(q.vr/Vt,60)),gf=1e-14*ef/Vt,gr=1e-14*er/Vt,It=1e-14*(ef-er);q.ic=It;G(B,Em,gf/200+1e-12);J(Em,B,1e-14*(ef-1)/200-gf/200*q.vd);G(B,C,gr/2+1e-12);J(C,B,1e-14*(er-1)/2-gr/2*q.vr);AD(C,B,gf-gr);AD(C,Em,-gf);AD(C,C,gr);AD(Em,B,gr-gf);AD(Em,Em,gf);AD(Em,C,-gr);J(Em,C,It-gf*q.vd+gr*q.vr)}else if(e.k=="J"){const q=e.p,Dn=e.a,Sn=e.b,Gn=e.g,vg=q.vd,vs=q.vr,t=vg+2.2,be=.0055/4.84;let I=0,gm=0,gd=1e-9;if(t>0){if(vs<t){I=be*(2*t*vs-vs*vs);gm=2*be*vs;gd+=2*be*(t-vs)}else{const l=1+.02*vs;I=be*t*t*l;gm=2*be*t*l;gd+=.02*be*t*t}}q.ic=I;AD(Dn,Gn,gm);AD(Dn,Sn,-gm-gd);AD(Dn,Dn,gd);AD(Sn,Gn,-gm);AD(Sn,Sn,gm+gd);AD(Sn,Dn,-gd);J(Sn,Dn,I-gm*vg-gd*vs)}else{const[I,g]=dio(e,e.p.vd);G(e.a,e.b,g);J(e.b,e.a,I-g*e.p.vd)}}
if(S.psu.cc)b[0]+=S.psu.i;else{A[0][0]+=20;b[0]+=20*V}
A[1][1]+=.02;b[1]+=.02*fv;A[5][5]+=.02;b[5]+=.02*fv2;const xv=15.6*Math.sin(314.16*t);A[6][6]+=.1;b[6]+=.1*xv;A[7][7]+=.1;b[7]-=.1*xv;
x=gauss(A,b,n);let mx=0;
for(const e of E)if(e.p&&DP[e.k]){const nv=(e.a<0?0:x[e.a])-(e.b<0?0:x[e.b]),o=e.p.vd,v=nv>o+.15?o+.15:nv;mx=Math.max(mx,Math.abs(v-o));e.p.vd=v}
for(const e of E)if(e.k=="Q"||e.k=="J"){const q=e.p,v=i=>i<0?0:x[i],j=e.k=="J",a=v(e.g)-v(e.b),c=j?v(e.a)-v(e.b):v(e.g)-v(e.a),s=j?.5:.15,l=(m,o)=>m>o+s?o+s:j&&m<o-s?o-s:m,na=l(a,q.vd),nc=l(c,q.vr);mx=Math.max(mx,Math.abs(na-q.vd),Math.abs(nc-q.vr));q.vd=na;q.vr=nc}
if(mx<1e-4)break}
M.x=x;const ip=(V-x[0])*20;
if(!S.psu.cc){if(ip>S.psu.i&&V>0){S.psu.cc=1;continue}}else if(x[0]>V){S.psu.cc=0;continue}
S.ip=S.psu.cc?S.psu.i:ip;break}
const x=M.x,vt=i=>i<0?0:x[i];
for(const e of E){if(!e.p)continue;const v=vt(e.a)-vt(e.b),p=e.p;let I;
if(e.k=="R")I=v/p.v;else if(e.k=="C"){I=p.v/dt*(v-p.vc);p.vc=v}else if(e.k=="Q"||e.k=="J")I=p.ic||0;else I=dio(e,p.vd)[0];
p.si+=I;p.sq+=I*I;p.n++}}
function simFrame(){const M=prep(),N=600,dt=S.sc.t*10/N,a=[],b=[],d=[];
for(let i=0;i<2*N;i++){stepSim(M,dt,S.T);S.T+=dt;a.push(M.x[2]);b.push(M.x[3]);d.push(M.x[4])}
for(const e of M.E){const p=e.p;if(!p)continue;const ia=p.si/p.n,ir=Math.sqrt(p.sq/p.n);p.i=Math.abs(ia);let w="";
if(p.t=="R"&&ir*ir*p.v>.25)w="Resistor "+fm(p.v,"Ω")+" overheated ("+(ir*ir*p.v).toFixed(2)+" W against a 0.25 W rating) and smoked. Use a larger value or lower the voltage.";
if(p.t=="LED"&&Math.abs(ia)>.03)w="LED burnt out at "+(Math.abs(ia)*1000).toFixed(0)+" mA (limit 30 mA). Add a series resistor.";
if(p.t=="D"&&Math.abs(ia)>1)w="Diode 1N4001 failed at "+Math.abs(ia).toFixed(1)+" A. Limit the current with a resistor.";
if(p.t=="Z"&&Math.abs(ia)*p.v>1.3)w="Zener overheated ("+(Math.abs(ia)*p.v).toFixed(1)+" W against 1.3 W). Add a series resistor.";
if(p.t=="C"&&p.v>=1e-6&&(p.vc<-1.5||p.vc>25))w=p.vc<0?"Electrolytic capacitor connected backwards and vented. The first hole you click is the + leg.":"Capacitor passed its 25 V rating and popped.";
if((p.t=="Q"||p.t=="J")&&Math.abs(ia)>.15)w="Transistor carried "+(Math.abs(ia)*1000|0)+" mA and burnt out. Add a collector or drain resistor.";if(w){p.x=1;p.vc=0;S.msgs.unshift(w);rebuild3d();draw();showMsg()}}
const L=S.sc.t*10/N;let st=0;for(let i=1;i<N;i++)if(a[i-1]<0&&a[i]>=0){st=i;break}
const sl=(q)=>q.slice(st,st+N);S.cur=[sl(a),sl(b)];
const dv=sl(d),mean=dv.reduce((s,v)=>s+v,0)/N;S.dmv=S.dm?Math.sqrt(dv.reduce((s,v)=>s+(v-mean)**2,0)/N):mean;
const c1=S.cur[0],mn=Math.min(...c1),mxv=Math.max(...c1);let f="--",i1=-1,i2=-1;
for(let i=1;i<N;i++)if(c1[i-1]<(mn+mxv)/2&&c1[i]>=(mn+mxv)/2){if(i1<0)i1=i;else{i2=i;break}}
if(i2>0)f=fm(1/((i2-i1)*L),"Hz");
$("#rd").textContent="CH1: mean "+(c1.reduce((s,v)=>s+v,0)/N).toFixed(2)+" V, ripple factor "+(()=>{const m=c1.reduce((s,v)=>s+v,0)/N;return m>.05?(Math.sqrt(c1.reduce((s,v)=>s+(v-m)**2,0)/N)/m).toFixed(3):"--"})()+", Vpp "+(mxv-mn).toFixed(2)+" V, Vp "+((mxv-mn)/2).toFixed(2)+" V, Vrms(sine) "+((mxv-mn)/2.828).toFixed(2)+" V, f "+f+"   Supply: "+(S.psu.on?S.psu.v.toFixed(1):0)+" V, "+S.ip.toFixed(3)+" A"+(S.psu.cc?" (CURRENT LIMIT)":"");
S.short=S.psu.cc&&S.ip>=S.psu.i*.99&&M.x[0]<.5;
if(supplySig()!==S.wsig)showMsg();
drawScope();$("#dm").textContent=S.dmv.toFixed(3)+(S.dm?" Vac":" V");drawTex()}
/* ---------- scope ---------- */
const scC=$("#sc"),sx=scC.getContext("2d");
function drawScope(){sx.fillStyle="#020a08";sx.fillRect(0,0,500,400);sx.strokeStyle="#1d4a3c";sx.lineWidth=1;
for(let i=0;i<=10;i++){sx.beginPath();sx.moveTo(i*50,0);sx.lineTo(i*50,400);sx.stroke()}
for(let i=0;i<=8;i++){sx.beginPath();sx.moveTo(0,i*50);sx.lineTo(500,i*50);sx.stroke()}
const[c1,c2]=S.cur||[[],[]],y1=v=>200-Math.max(-4.3,Math.min(4.3,v/S.sc.v1))*50,y2=v=>200-Math.max(-4.3,Math.min(4.3,v/S.sc.v2))*50;
const tr=(arr,col,fy)=>{sx.strokeStyle=col;sx.lineWidth=2;sx.beginPath();arr.forEach((v,i)=>i?sx.lineTo(i/600*500,fy(v)):sx.moveTo(0,fy(v)));sx.stroke()};
if(S.sc.xy){sx.strokeStyle="#facc15";sx.lineWidth=2;sx.beginPath();c1.forEach((v,i)=>{const X=250+Math.max(-4.9,Math.min(4.9,v/S.sc.v1))*50,Y=y2(c2[i]);i?sx.lineTo(X,Y):sx.moveTo(X,Y)});sx.stroke()}
else{tr(c1,"#facc15",y1);tr(c2,"#22d3ee",y2)}
sx.fillStyle="#8fd";sx.font="12px monospace";sx.fillText(S.sc.xy?"X-Y":"Y-T  "+fm(S.sc.t,"s")+"/div",6,14)}
/* ---------- breadboard wiring panel ---------- */
const X=c=>34+c*21.3,Y=[100,114,128,142,156,198,212,226,240,254,56,70,296,310],JX=[40,106,172,238,304,370,436,502,568,634],JL=["PSU +","FG +","CH1","CH2","DMM V","GND","GND","FG2 +","XF AC1","XF AC2"];
const pos=h=>h>=1000?[JX[h-1000],24]:[X(h/NR|0),Y[h%NR]];
const WC=["#ef4444","#3b82f6","#f59e0b","#a855f7","#22c55e","#f97316"],PC={R:"#d2b48c",C:"#2563eb",D:"#333",LED:"#ef4444",Z:"#b45309"};
function draw(){let s="";
S.w.forEach((w,i)=>{const[a,b]=pos(w.a),[c,d]=pos(w.b);s+=`<line class="it" data-w="${i}" x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${WC[i%6]}" stroke-width="4" stroke-linecap="round"/>`});
S.p.forEach((p,i)=>{const[a,b]=pos(p.a),[c,d]=pos(p.b),col=p.x?"#666":PC[p.t],lb=p.t=="Q"?"NPN":p.t=="J"?"JFET":p.t=="Z"?p.v+"V":p.t=="LED"||p.t=="D"?p.t:fm(p.v,p.t=="R"?"Ω":"F");
s+=`<line class="it" data-pi="${i}" x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${col}" stroke-width="9" stroke-linecap="round"/><text x="${(a+c)/2+6}" y="${(b+d)/2-8}">${p.x?"✖ ":""}${lb}${p.t=="C"?"+":""}</text>`+(p.g!=null?(([x,y])=>`<line class="it" data-pi="${i}" x1="${(a+c)/2}" y1="${(b+d)/2}" x2="${x}" y2="${y}" stroke="#facc15" stroke-width="5" stroke-linecap="round"/>`)(pos(p.g)):"")});
for(let c=0;c<NC;c++)for(let r=0;r<NR;r++){const h=c*NR+r,[x,y]=pos(h);s+=`<circle class="h${r>=10?" rl":""}${S.q.includes(h)?" pd":""}" data-h="${h}" cx="${x}" cy="${y}" r="5.5"/>`}
JL.forEach((l,i)=>{const[x,y]=pos(1000+i);s+=`<circle class="jk${S.q.includes(1000+i)?" pd":""}" data-h="${1000+i}" cx="${x}" cy="${y}" r="10"/><text x="${x-16}" y="${y+24}">${l}</text>`});
